[project]
name = "credit-mate-ai"
version = "0.1.0"
description = "AI-powered credit card discovery platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "djangorestframework~=3.17.0",
    "djangorestframework-simplejwt~=5.5.0",
    "django-filter>=26.2,<27",
    "celery>=5.6,<6",
    "redis>=8.1,<9",
    "requests~=2.33.0",
    "python-magic~=0.4.27",
    "pandas>=3,<4",
    "urllib3",
    "django-cors-headers>=4.9,<5",
    "gunicorn>=26.2,<27",
    "psycopg2-binary~=2.9.9",
    "dj-database-url",
    "python-dotenv",
    "sentry-sdk~=2.0",
    "google-genai",
    "beautifulsoup4",
    "pytesseract",
    "pillow",
    "pymupdf",
    "openai",
    "pypdf",
    "whitenoise",
    "elasticsearch>=8.18,<9",
    "drf-spectacular>=0.30,<0.31",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.12,<5",
    "pytest-socket>=0.8,<0.9",
    "pytest-cov>=7,<8",
    "factory-boy~=3.3.3",
    "black>=26,<27",
    "flake8>=7.3,<8",
    "isort>=7,<8",
    "pre-commit>=4.5,<5",
    "pip-audit>=2.10,<3",
    "bandit[toml]>=1.9,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credit_mate_ai", "banks", "credit_cards", "common", "accounts"]

[tool.black]
line-length = 90
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.idea
  | \.git
  | \.pytest_cache
  | \.venv
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 90
known_django = "django"
known_first_party = "credit_mate_ai"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["migrations"]
skip_glob = [".venv/*", "venv/*", "env/*", ".env/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "credit_mate_ai.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--tb=short --strict-markers"
testpaths = ["."]

[tool.bandit]
exclude_dirs = [
  ".git",
  ".github",
  ".venv",
  "__pycache__",
  "tests",
  "scripts",
  "factories.py"
]

[tool.uv]
constraint-dependencies = ["filelock<4", "soupsieve<3", "virtualenv<21"]

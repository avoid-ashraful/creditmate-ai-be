name: Secret Scan (gitleaks)

# Scans for committed secrets with gitleaks.
#  - pull_request: scans only the commits in the PR.
#  - weekly schedule / manual: scans the full git history.
# False positives for test data, fixtures and docs examples are
# allowlisted (with explanations) in .gitleaks.toml at the repo root.
#
# The pinned gitleaks *binary* is installed directly instead of using
# the marketplace action, whose licence terms for organisation use are
# unclear. The tarball is verified against its pinned SHA-256 checksum.

on:
  pull_request:
    branches: [master, main]
  schedule:
    # Mondays 03:17 UTC — full-history scan.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks-pr:
    name: gitleaks (PR commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history is needed so the base..head range exists locally.
          fetch-depth: 0

      - name: Install gitleaks (pinned binary, checksum-verified)
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  gitleaks-full-history:
    name: gitleaks (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (pinned binary, checksum-verified)
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact .

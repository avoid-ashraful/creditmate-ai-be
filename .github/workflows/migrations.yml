name: Migration Checks

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

env:
  SECRET_KEY: "ci-only-secret-key-with-sufficient-length-and-entropy-123456789"
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/creditmate_test"
  CACHE_BACKEND: locmem

jobs:
  migration-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creditmate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Check model and migration consistency
        run: uv run --frozen python manage.py makemigrations --dry-run --check
      - name: Validate and apply migration graph on a clean database
        run: |
          uv run --frozen python manage.py migrate --plan
          uv run --frozen python manage.py migrate --noinput
          uv run --frozen python manage.py migrate --check
      - name: Validate API schema
        run: uv run --frozen python manage.py spectacular --validate --fail-on-warn --file schema.yaml

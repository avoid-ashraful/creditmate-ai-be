name: Security Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  SECRET_KEY: "ci-only-secret-key-with-sufficient-length-and-entropy-123456789"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CACHE_BACKEND: locmem

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
          uv run --frozen pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
      - name: Security static analysis
        run: uv run --frozen bandit -c pyproject.toml -r accounts banks common credit_cards credit_mate_ai reviews saved -ll
      - name: Enforce Django deployment checks
        run: uv run --frozen python manage.py check --deploy --fail-level WARNING

# zizmor configuration for creditmate-ai-be.
# Docs: https://docs.zizmor.sh/configuration/
#
# The `ignore` entries below are a deliberately narrow, pre-existing-findings
# baseline: they let the workflow-audit gate (see workflows/workflow-audit.yml)
# pass today while still failing on any NEW finding anywhere else.
# Each entry should be removed as its underlying finding is fixed.

rules:
  artipacked:
    ignore:
      # Pre-existing: actions/checkout steps in the workflows below do not yet
      # set `persist-credentials: false`, so the checkout token can persist
      # into later steps / uploaded artifacts.
      # Follow-up: add `persist-credentials: false` to each checkout step
      # (none of these workflows push to git, so this is safe) and delete the
      # corresponding ignore line.
      - code-quality.yml:16
      - evals-nightly.yml:47
      - migrations.yml:37
      - security.yml:25
      - tests.yml:57
